name: Deploy to gh-pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install minifier tools
        run: npm install -g terser clean-css-cli html-minifier-terser

      - name: Build dist folder
        run: |
          node scripts/build-site.mjs
          terser dist/js/index.js --compress --mangle --output dist/js/index.js
          terser dist/personal-match-site/main.js --compress --mangle --output dist/personal-match-site/main.js
          cleancss -o dist/css/index.css dist/css/index.css
          cleancss -o dist/personal-match-site/styles.css dist/personal-match-site/styles.css
          for page in dist/index.html dist/404.html dist/personal-match-site/index.html; do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --minify-css true \
              --minify-js true \
              "$page" -o "$page"
          done
          node scripts/check-site.mjs dist

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gp-pages
          keep_files: false
