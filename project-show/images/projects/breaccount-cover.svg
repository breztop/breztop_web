  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#252820" stroke-opacity=".06"/></pattern></defs>
  <rect width="960" height="800" rx="12" fill="#ece8dc"/>
  <rect width="960" height="800" rx="12" fill="url(#grid)"/>
  <g font-family="monospace" fill="#68685e"><text x="48" y="59" font-size="15" letter-spacing="3">BRE / IDENTITY SYSTEM</text><text x="48" y="750" font-size="13" letter-spacing="2">ONE IDENTITY. CONNECTED PRODUCTS.</text></g>
  <path d="M480 440V570M480 570H185V625M480 570V625M480 570H775V625" stroke="#c54b26" stroke-width="3"/>
  <g fill="#c54b26"><circle cx="480" cy="570" r="7"/><circle cx="185" cy="625" r="5"/><circle cx="480" cy="625" r="5"/><circle cx="775" cy="625" r="5"/></g>
  <rect x="136" y="145" width="698" height="348" rx="16" fill="#252820" fill-opacity=".08"/>
  <rect x="120" y="128" width="698" height="348" rx="16" fill="#faf7ee" stroke="#252820" stroke-width="2"/>
  <path d="M120 201H818" stroke="#252820" stroke-opacity=".2"/>
  <circle cx="158" cy="165" r="8" fill="#c54b26"/>
  <text x="184" y="171" font-family="monospace" font-size="16" fill="#252820" letter-spacing="2">UNIFIED ACCOUNT</text>
  <text x="704" y="171" font-family="monospace" font-size="14" fill="#77796d">V1 / AUTH</text>
  <rect x="160" y="240" width="150" height="168" rx="8" fill="#eddfcc"/>
  <circle cx="235" cy="293" r="25" stroke="#c54b26" stroke-width="3"/>
  <path d="M190 372C190 324 280 324 280 372" stroke="#c54b26" stroke-width="3" stroke-linecap="round"/>
  <text x="350" y="267" font-family="monospace" font-size="13" fill="#77796d" letter-spacing="2">BRE UID / SUBJECT</text>
  <text x="345" y="330" font-family="sans-serif" font-weight="700" font-size="55" fill="#252820" letter-spacing="-2">BreAccount</text>
  <text x="350" y="364" font-family="monospace" font-size="15" fill="#77796d">OIDC · PKCE S256 · RS256</text>
  <rect x="350" y="390" width="118" height="30" rx="4" fill="#d7e5b4"/>
