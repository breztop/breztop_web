  <text x="489" y="410" font-family="monospace" font-size="12" fill="#77796d">SCOPED ACCESS</text>
  <g transform="rotate(-9 790 440)"><circle cx="790" cy="440" r="65" stroke="#c54b26" stroke-width="2"/><circle cx="790" cy="440" r="56" stroke="#c54b26" stroke-width="1"/><path d="m768 439 16 16 29-33" stroke="#c54b26" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="753" y="476" font-family="monospace" font-size="10" fill="#c54b26" letter-spacing="2">AUTHORIZED</text></g>
  <g fill="#faf7ee" stroke="#252820" stroke-width="1.5"><rect x="75" y="626" width="220" height="65" rx="6"/><rect x="370" y="626" width="220" height="65" rx="6"/><rect x="665" y="626" width="220" height="65" rx="6"/></g>
  <g font-family="monospace" font-size="17" fill="#252820" text-anchor="middle"><text x="185" y="665">WEB / COOKIE</text><text x="480" y="665">DESKTOP / PKCE</text><text x="775" y="665">GAME / SESSION</text></g>
