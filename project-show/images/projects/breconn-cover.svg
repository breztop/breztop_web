<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">breconn unified networking architecture</title>
  <desc id="desc">A dark technical diagram showing application channels connected to transport and protocol plugins.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1e35"/>
      <stop offset="1" stop-color="#102d45"/>
    </linearGradient>
    <linearGradient id="channel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20d4ff"/>
      <stop offset="1" stop-color="#6f7cff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#28d7ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#28d7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7bdcff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="url(#background)"/>
  <rect width="1536" height="1024" fill="url(#grid)"/>
  <circle cx="1190" cy="250" r="360" fill="url(#glow)"/>
  <circle cx="230" cy="840" r="290" fill="url(#glow)" opacity="0.55"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="112" y="132" fill="#f4fbff" font-size="72" font-weight="700" letter-spacing="-2">breconn</text>
    <text x="116" y="179" fill="#88a9bd" font-size="21" font-weight="600" letter-spacing="5">UNIFIED ASYNC NETWORKING</text>

    <g transform="translate(112 258)">
      <rect width="1312" height="154" rx="28" fill="#0f2b43" stroke="#3edaff" stroke-opacity="0.7" stroke-width="2"/>
      <rect x="28" y="27" width="1256" height="100" rx="18" fill="url(#channel)" opacity="0.12"/>
      <circle cx="84" cy="77" r="23" fill="#31d7ff" filter="url(#softGlow)"/>
      <text x="128" y="69" fill="#90edff" font-size="19" font-weight="600" letter-spacing="4">UNIFIED API</text>
      <text x="128" y="105" fill="#ffffff" font-size="39" font-weight="700">CHANNEL</text>
      <text x="1035" y="87" fill="#a9c5d7" font-size="21">open · read · write · close</text>
    </g>

    <path d="M768 412V480" stroke="#4fe0ff" stroke-width="4" stroke-dasharray="10 12"/>
    <circle cx="768" cy="446" r="8" fill="#4fe0ff"/>

    <g transform="translate(112 500)">
      <text y="0" fill="#88a9bd" font-size="18" font-weight="600" letter-spacing="4">TRANSPORT BACKENDS</text>
      <g transform="translate(0 30)">
        <rect width="270" height="126" rx="22" fill="#102d46" stroke="#31d7ff" stroke-opacity="0.55"/>
        <text x="30" y="54" fill="#6ee8ff" font-size="18">STREAM</text>
        <text x="30" y="94" fill="#ffffff" font-size="35" font-weight="700">TCP</text>
      </g>
      <g transform="translate(294 30)">
        <rect width="270" height="126" rx="22" fill="#102d46" stroke="#31d7ff" stroke-opacity="0.55"/>
        <text x="30" y="54" fill="#6ee8ff" font-size="18">DATAGRAM · MULTICAST</text>
        <text x="30" y="94" fill="#ffffff" font-size="35" font-weight="700">UDP</text>
      </g>
      <g transform="translate(588 30)">
        <rect width="270" height="126" rx="22" fill="#102d46" stroke="#777fff" stroke-opacity="0.75"/>
        <text x="30" y="54" fill="#aeb4ff" font-size="18">RELIABLE UDP</text>
        <text x="30" y="94" fill="#ffffff" font-size="35" font-weight="700">KCP</text>
      </g>
      <g transform="translate(882 30)">
        <rect width="270" height="126" rx="22" fill="#0c2135" stroke="#7791a5" stroke-dasharray="8 8"/>
        <text x="30" y="54" fill="#7f9bae" font-size="18">PLANNED</text>
        <text x="30" y="94" fill="#b8c7d0" font-size="35" font-weight="700">QUIC</text>
      </g>
      <g transform="translate(1176 30)">
        <rect width="136" height="126" rx="22" fill="#102d46" stroke="#31d7ff" stroke-opacity="0.4"/>
        <text x="68" y="52" text-anchor="middle" fill="#6ee8ff" font-size="17">CORE</text>
        <text x="68" y="91" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">ASIO</text>
      </g>
    </g>

    <path d="M768 686V746" stroke="#8b92ff" stroke-width="4" stroke-dasharray="10 12"/>
    <circle cx="768" cy="716" r="8" fill="#8b92ff"/>

    <g transform="translate(112 766)">
      <text y="0" fill="#88a9bd" font-size="18" font-weight="600" letter-spacing="4">PROTOCOL PLUGINS</text>
      <g transform="translate(0 30)">
        <rect width="356" height="110" rx="22" fill="#171f44" stroke="#7b83ff" stroke-opacity="0.75"/>
        <text x="32" y="68" fill="#ffffff" font-size="34" font-weight="700">HTTP</text>
        <circle cx="310" cy="55" r="9" fill="#35e2ff"/>
      </g>
      <g transform="translate(380 30)">
        <rect width="356" height="110" rx="22" fill="#171f44" stroke="#7b83ff" stroke-opacity="0.75"/>
        <text x="32" y="68" fill="#ffffff" font-size="34" font-weight="700">WEBSOCKET</text>
        <circle cx="310" cy="55" r="9" fill="#35e2ff"/>
      </g>
      <g transform="translate(760 30)">
        <rect width="356" height="110" rx="22" fill="#101c34" stroke="#8a9db0" stroke-dasharray="8 8"/>
        <text x="32" y="48" fill="#819aaa" font-size="16">DISCOVERY · EXTENSIBLE</text>
        <text x="32" y="80" fill="#dce8ef" font-size="28" font-weight="700">mDNS · RTP · MORE</text>
        <text x="310" y="70" text-anchor="middle" fill="#7f9bae" font-size="36">+</text>
      </g>
    </g>

    <text x="112" y="965" fill="#66879c" font-size="16" letter-spacing="3">TRANSPORTS EVOLVE · THE CHANNEL STAYS STABLE</text>
    <text x="1424" y="965" text-anchor="end" fill="#66879c" font-size="16">12 / 2026</text>
  </g>
</svg>
