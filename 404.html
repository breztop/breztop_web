    @keyframes skate { from { transform: translateY(-1px) rotate(-2deg); } to { transform: translateY(2px) rotate(2deg); } }

  <a class="home" href="https://brez.top/" data-home><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14"/></svg>返回乐园</a>
  <script>
    if (location.hostname.endsWith('.github.io')) {
      document.querySelectorAll('[data-home]').forEach(link => { link.href = '/breztop_web/'; });
    } else if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      document.querySelectorAll('[data-home]').forEach(link => { link.href = '/'; });
    }
    (() => {
      const scene = document.getElementById('boundary-scene');
      const player = document.getElementById('boundary-player');
      const sky = document.getElementById('boundary-sky');
      const mountains = document.getElementById('boundary-mountains');
      const woods = document.getElementById('boundary-woods');
      const motion = matchMedia('(prefers-reduced-motion: reduce)');
      const keys = new Set();
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      let x = 642;
      let target = x;
      let camera = 0;
      let cameraTarget = 0;
      let viewWidth = 1440;
      let viewHeight = 900;
      let initialized = false;
      let cameraOrigin = 0;
      let frame = 0;
      let lastTick = 0;
      let drag = null;

      function follow() {
        if (x < camera + viewWidth * .28) cameraTarget = x - viewWidth * .28;
        else if (x > camera + viewWidth * .67) cameraTarget = x - viewWidth * .67;
        cameraTarget = clamp(cameraTarget, 0, Math.max(0, 3200 - viewWidth));
      }
      function render() {
        scene.setAttribute('viewBox', `${camera.toFixed(2)} ${900 - viewHeight} ${viewWidth} ${viewHeight}`);
        player.setAttribute('transform', `translate(${x.toFixed(2)} 744)`);
        const offset = camera - cameraOrigin;
        sky.setAttribute('transform', `translate(${(offset * .88).toFixed(2)} 0)`);
        mountains.setAttribute('transform', `translate(${(offset * .28).toFixed(2)} 0)`);
        woods.setAttribute('transform', `translate(${(offset * .12).toFixed(2)} 0)`);
      }
      function tick(now) {
        frame = 0;
        const dt = Math.min((now - (lastTick || now)) / 1000, .04);
        lastTick = now;
        const direction = Number(keys.has('ArrowRight')) - Number(keys.has('ArrowLeft'));
        if (direction) target = clamp(target + direction * 330 * dt, 100, 3100);
        const before = x;
        const blend = motion.matches || drag?.onPlayer ? 1 : 1 - Math.exp(-dt * 16);
        x += (target - x) * blend;
        if (Math.abs(target - x) < .1) x = target;
        if (Math.abs(x - before) > .02) player.dataset.direction = x < before ? 'left' : 'right';
        follow();
        camera += (cameraTarget - camera) * (motion.matches ? 1 : 1 - Math.exp(-dt * 12));
        if (Math.abs(cameraTarget - camera) < .1) camera = cameraTarget;
        render();
        const moving = Math.abs(x - before) > .02 || direction !== 0;
        player.classList.toggle('is-moving', moving);
        if (direction || Math.abs(target - x) > .1 || Math.abs(cameraTarget - camera) > .1) schedule();
        else { lastTick = 0; player.classList.remove('is-moving'); }
      }
      function schedule() { if (!frame && !document.hidden) frame = requestAnimationFrame(tick); }
      function layout() {
        const rect = scene.getBoundingClientRect();
        viewHeight = Math.min(900, 3200 * rect.height / rect.width);
        viewWidth = viewHeight * rect.width / rect.height;
        const maximum = Math.max(0, 3200 - viewWidth);
        camera = clamp(initialized ? camera : 730 - viewWidth / 2, 0, maximum);
        cameraTarget = camera;
        if (!initialized) cameraOrigin = camera;
        initialized = true;
        follow();
        render();
        schedule();
      }
      function worldX(clientX) {
        const rect = scene.getBoundingClientRect();
        return camera + (clientX - rect.left) / rect.width * viewWidth;
      }
      function stop() {
        cancelAnimationFrame(frame); frame = 0; lastTick = 0;
        keys.clear(); drag = null; target = x; cameraTarget = camera;
        scene.classList.remove('is-dragging');
        player.classList.remove('is-moving');
      }
      scene.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        stop();
        scene.focus({ preventScroll: true });
        drag = { id: event.pointerId, start: event.clientX, from: x,
          offset: worldX(event.clientX) - x, onPlayer: !!event.target.closest('#boundary-player'), moved: false };
        scene.setPointerCapture(event.pointerId);
        scene.classList.add('is-dragging');
      });
      scene.addEventListener('pointermove', event => {
        if (!drag || drag.id !== event.pointerId) return;
        if (Math.abs(event.clientX - drag.start) > 5) drag.moved = true;
        if (!drag.moved) return;
        event.preventDefault();
        const next = drag.onPlayer ? worldX(event.clientX) - drag.offset
          : drag.from - (event.clientX - drag.start) * viewWidth / scene.clientWidth;
        target = clamp(next, 100, 3100);
        schedule();
      });
      function release(event) {
        if (!drag || drag.id !== event.pointerId) return;
        const previous = drag;
        drag = null;
        if (scene.hasPointerCapture(event.pointerId)) scene.releasePointerCapture(event.pointerId);
        scene.classList.remove('is-dragging');
        if (event.type === 'pointerup' && !previous.moved && !previous.onPlayer) target = clamp(worldX(event.clientX), 100, 3100);
        schedule();
      }
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => scene.addEventListener(type, release));
      scene.addEventListener('wheel', event => {
        if (event.ctrlKey || event.metaKey) return;
        event.preventDefault();
        const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
        const multiplier = event.deltaMode === 1 ? 18 : event.deltaMode === 2 ? scene.clientWidth : 1;
        target = clamp(target + delta * multiplier * viewWidth / scene.clientWidth, 100, 3100);
        schedule();
      }, { passive: false });
      window.addEventListener('keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault(); keys.add(event.key); schedule();
        }
      });
      window.addEventListener('keyup', event => { keys.delete(event.key); });
      window.addEventListener('blur', stop);
      window.addEventListener('resize', layout);
      document.addEventListener('visibilitychange', () => {
        document.documentElement.classList.toggle('page-hidden', document.hidden);
        if (document.hidden) stop();
      });
      motion.addEventListener('change', () => { stop(); layout(); });
      layout();
    })();
    window.goatcounter = { path: function () { return '/' + location.host + location.pathname; }, title: document.title };
  </script>
  <script data-goatcounter="https://stats.brez.top/count" async src="https://stats.brez.top/count.js"></script>
